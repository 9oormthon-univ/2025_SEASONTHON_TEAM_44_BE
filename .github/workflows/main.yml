name: Spring Boot CI/CD with DockerHub

on:
  # 1. main 브랜치에 직접 push될 때 실행
  push:
    branches: [ "v2" ]
    
  # 2. main 브랜치로 Pull Request가 merge될 때 실행
  pull_request:
    branches: [ "v2" ]
    types: [closed] # Pull Request가 닫혔을 때

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4 

    # JDK 17 설정 (스프링 부트 빌드에 필요)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Gradle 실행 권한 부여
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # Gradle로 스프링 부트 빌드
    - name: Build with Gradle
      run: ./gradlew build -x test

    # DockerHub 로그인
    - name: Log in to DockerHub
      uses: docker/login-action@v3 # 최신 버전 사용 권장
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Docker 이미지 빌드 & 푸시
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/9oorm-server:latest


    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3 
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: halim7753 
        key: ${{ secrets.SERVER_SSH_KEY }}
        passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
        script: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/9oorm-server
          
          # 1. 새 버전 이미지 pull
          docker pull $IMAGE_NAME:latest
          
          # 2. 기존 컨테이너가 있는지 확인
          OLD_CONTAINER_ID=$(docker ps -q --filter "name=9oorm-server")
          
          # 3. 새 컨테이너를 다른 이름으로 실행 (포트 및 볼륨 마운트 수정)
          docker run -d --name 9oorm-server-new -p 8080:8080 \
            --network 9oorm-network \
            -v /home/halim7753/application.yaml:/app/application.yaml \
            $IMAGE_NAME:latest
            
          # 4. 기존 컨테이너가 있었다면 중지 및 삭제
          if [ ! -z "$OLD_CONTAINER_ID" ]; then
            sleep 10
            docker stop $OLD_CONTAINER_ID
            docker rm $OLD_CONTAINER_ID
          fi
          
          # 5. 새 컨테이너 이름을 원래 이름으로 변경
          docker rename 9oorm-server-new 9oorm-server
          
          # 6. 사용하지 않는 이미지 정리
          docker image prune -f
