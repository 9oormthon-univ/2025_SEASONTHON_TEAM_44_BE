name: Spring Boot CI/CD with DockerHub

on:
  # 1. main 브랜치에 직접 push될 때 실행
  push:
    branches: [ "v2" ]
    
  # 2. main 브랜치로 Pull Request가 merge될 때 실행
  pull_request:
    branches: [ "v2" ]
    types: [closed] # Pull Request가 닫혔을 때

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4 

    # JDK 17 설정 (스프링 부트 빌드에 필요)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Gradle 실행 권한 부여
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # Gradle로 스프링 부트 빌드
    - name: Build with Gradle
      run: ./gradlew build -x test

    # DockerHub 로그인
    - name: Log in to DockerHub
      uses: docker/login-action@v3 # 최신 버전 사용 권장
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Docker 이미지 빌드 & 푸시
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/9oorm-server:latest


    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3 
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: halim7753 
        key: ${{ secrets.SERVER_SSH_KEY }}
        passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
        script: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/9oorm-server
          CONTAINER_NAME=9oorm-server
          
          # 1. 새 버전 이미지 pull
          docker pull $IMAGE_NAME:latest
          
          # 2. 기존 컨테이너 중지 및 삭제 (있다면)
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true
          
          # 3. 새 컨테이너 실행
          docker run -d --name $CONTAINER_NAME -p 8080:8080 \
            --network 9oorm-network \
            -v /home/halim7.yaml:/app/application.yaml \
            $IMAGE_NAME:latest
          
          # 4. 사용하지 않는 이미지 정리
          docker image prune -f